                                </div>
                            </div>
                            <p class="text-charcoal/80 leading-relaxed font-light mb-10 text-lg">
                                ${data.experience.description}
                            </p>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                ${data.experience.achievements.map((ach) => `
                                    <div class="bg-cream p-6 border border-ivory">
                                        <p class="font-serif text-4xl text-espresso mb-2">${ach.stat}</p>
                                        <h4 class="text-sm font-bold uppercase tracking-wider text-beige mb-2">${ach.title}</h4>
                                        <p class="text-xs text-charcoal/70 font-light leading-relaxed">${ach.desc}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </section>

                <!-- SECTION 05: ABOUT -->
                <section id="about" class="py-28 bg-ivory/30 border-t border-ivory">
                    <div class="max-w-7xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-12 gap-16 items-center">
                        <div class="lg:col-span-5 flex justify-center">
                            <div class="relative w-full max-w-md aspect-[4/5] bg-ivory border border-beige/30 p-4 shadow-xl">
                                <img src="${data.aboutPortraitUrl}" alt="${data.fullName}" class="w-full h-full object-cover grayscale contrast-125 hover:grayscale-0 transition-all duration-700" onerror="this.src='https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=800&auto=format&fit=crop'">
                            </div>
                        </div>
                        <div class="lg:col-span-7 space-y-6">
                            <p class="text-xs tracking-widest uppercase text-beige font-semibold">Personal Profile</p>
                            <h2 class="font-serif text-4xl md:text-5xl text-espresso">A Little About Me</h2>
                            <p class="text-charcoal/80 font-light leading-relaxed text-lg">
                                ${data.aboutBio}
                            </p>
                            <p class="text-charcoal/80 font-light leading-relaxed">
                                ${data.careerStory}
                            </p>
                        </div>
                    </div>
                </section>

                <!-- SECTION 06: SKILLS -->
                <section id="skills" class="py-28 bg-cream">
                    <div class="max-w-7xl mx-auto px-6">
                        <div class="text-center max-w-2xl mx-auto mb-20">
                            <p class="text-xs tracking-widest uppercase text-beige font-semibold mb-3">Competencies</p>
                            <h2 class="font-serif text-4xl md:text-5xl text-espresso">Skills & Tools</h2>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                            ${data.skillsCategories.map((cat) => `
                                <div class="p-8 bg-ivory/30 border border-ivory">
                                    <h3 class="font-serif text-2xl text-espresso mb-6 pb-4 border-b border-ivory">${cat.title}</h3>
                                    <ul class="space-y-3">
                                        ${cat.skills.map((skill) => `
                                            <li class="flex items-center text-charcoal/80 font-light text-sm">
                                                <span class="w-1.5 h-1.5 bg-beige rounded-full mr-3"></span>
                                                ${skill}
                                            </li>
                                        `).join('')}
                                    </ul>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </section>

                <!-- SECTION 07: CERTIFICATIONS -->
                <section id="certifications" class="py-28 bg-ivory/20 border-t border-ivory">
                    <div class="max-w-7xl mx-auto px-6">
                        <div class="text-center max-w-2xl mx-auto mb-20">
                            <p class="text-xs tracking-widest uppercase text-beige font-semibold mb-3">Credentials</p>
                            <h2 class="font-serif text-4xl md:text-5xl text-espresso">Certifications & Professional Development</h2>
                        </div>
                        <div class="max-w-3xl mx-auto space-y-6">
                            ${data.certifications.map((cert) => `
                                <div class="bg-cream p-8 border border-ivory flex flex-col md:flex-row md:items-center justify-between gap-6">
                                    <div>
                                        <p class="text-xs text-beige uppercase tracking-wider mb-1 font-medium">${cert.issuer} &bull; ${cert.date}</p>
                                        <h3 class="font-serif text-2xl text-espresso mb-2">${cert.name}</h3>
                                        <p class="text-charcoal/70 text-sm font-light leading-relaxed">${cert.description}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </section>

                <!-- SECTION 08: CONTACT -->
                <section id="contact" class="py-28 bg-espresso text-ivory">
                    <div class="max-w-4xl mx-auto px-6 text-center space-y-8">
                        <p class="text-xs tracking-widest uppercase text-beige font-semibold">Get In Touch</p>
                        <h2 class="font-serif text-5xl md:text-6xl text-ivory">Let's Work Together.</h2>
                        <p class="text-ivory/70 text-lg font-light max-w-xl mx-auto leading-relaxed">
                            Looking for reliable support with your e-commerce operations? I'd love to hear about your business and how I can help.
                        </p>
                        <div class="pt-6 flex flex-wrap justify-center gap-4">
                            <a href="mailto:${data.contactEmail}" class="px-8 py-4 bg-ivory text-espresso text-sm tracking-wider uppercase font-medium hover:bg-beige transition-all duration-300">
                                Get in Touch (Email)
                            </a>
                            ${data.linkedinUrl && data.linkedinUrl !== '#' ? `
                                <a href="${data.linkedinUrl}" target="_blank" rel="noopener noreferrer" class="px-8 py-4 border border-ivory/30 text-ivory text-sm tracking-wider uppercase font-medium hover:border-ivory transition-all duration-300">
                                    LinkedIn Profile
                                </a>
                            ` : ''}
                        </div>
                    </div>
                </section>
            `;
        }

        // OPEN CASE STUDY MODAL
        function openCaseStudy(projectId) {
            const project = defaultPortfolioData.projects.find(p => p.id === projectId);
            if (!project) return;

            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = `
                <div class="space-y-8 max-h-[75vh] overflow-y-auto pr-4">
                    <div>
                        <span class="text-xs tracking-widest uppercase text-beige font-semibold">${project.category}</span>
                        <h2 class="font-serif text-3xl md:text-4xl text-espresso mt-2 mb-4">${project.title}</h2>
                        <p class="text-charcoal/80 font-light leading-relaxed">${project.overview}</p>
                    </div>

                    <div>
                        <h3 class="font-serif text-xl text-espresso mb-3">Project Objectives</h3>
                        <ul class="space-y-2">
                            ${project.objectives.map(obj => `
                                <li class="flex items-start text-sm text-charcoal/70 font-light">
                                    <span class="text-beige mr-3 font-bold">&bull;</span>
                                    ${obj}
                                </li>
                            `).join('')}
                        </ul>
                    </div>

                    <div>
                        <h3 class="font-serif text-xl text-espresso mb-3">Tools Used</h3>
                        <div class="flex flex-wrap gap-2">
                            ${project.tools.map(tool => `
                                <span class="px-3 py-1 bg-ivory text-espresso text-xs tracking-wider uppercase">${tool}</span>
                            `).join('')}
                        </div>
                    </div>

                    <div>
                        <h3 class="font-serif text-xl text-espresso mb-3">Workflow & Execution</h3>
                        <p class="text-charcoal/70 text-sm font-light leading-relaxed">${project.workflow}</p>
                    </div>

                    ${project.images && project.images.length > 0 ? `
                        <div>
                            <h3 class="font-serif text-xl text-espresso mb-3">Project Screenshots</h3>
                            <div class="grid grid-cols-1 gap-4">
                                ${project.images.map(img => `
                                    <div class="bg-ivory overflow-hidden border border-beige/30">
                                        <img src="${img}" alt="Project Screenshot" class="w-full h-auto object-contain">
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;

            document.getElementById('case-study-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        document.getElementById('close-modal').addEventListener('click', () => {
            document.getElementById('case-study-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        });

        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        mobileMenuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });

        document.querySelectorAll('#mobile-menu a').forEach(link => {
            link.addEventListener('click', () => {
                mobileMenu.classList.add('hidden');
            });
        });

        window.addEventListener('DOMContentLoaded', renderPortfolio);
    </script>
</body>
</html>
